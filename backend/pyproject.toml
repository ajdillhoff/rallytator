[project]
name = "rallytator-backend"
version = "0.1.0"
description = "RallyTator backend — frame delivery + annotation store (see ../CONTEXT.md, ../docs/adr/)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "av>=13.1",          # PyAV — frame-accurate seek+decode (ADR-0002)
    "pillow>=11.0",      # JPEG encode
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",       # test client
    "pytest>=8.3",
]
# GPU model assist (SAM3 / RFDETR). Optional: the base install is CPU-only and the worker
# imports these lazily, 503-ing cleanly if the group isn't synced. Install with
# `uv sync --group models` on the GPU machine. SAM3 ships inside transformers (>=5.14);
# its weights are gated (accept the license + `hf auth login`). RFDETR weights auto-download.
models = [
    "torch>=2.4",
    "rfdetr>=1.9",
    "transformers>=5.14",   # SAM3: Sam3TrackerModel / Sam3TrackerVideoModel
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]        # rallytator is a source tree, not an installed package
testpaths = ["tests"]
